name: Deploy to VPS

on:
  push:
    branches:
      - main  # Sprawdź czy w VS Code na dole masz 'main' czy 'master'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high

  deploy:
    needs: [audit]
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: 57.128.218.55
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/root/.npm-global/bin:/usr/local/bin:$(npm bin -g 2>/dev/null)"
            cd /root/fabiole-app
            git fetch origin main
            git reset --hard origin/main
            npm install
            npx prisma generate
            npm run build
            pm2 restart fabiole-app || PORT=3000 pm2 start npm --name "fabiole-app" -- run start
            pm2 save