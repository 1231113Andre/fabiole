name: Deploy to VPS

on:
  push:
    branches:
      - main  # Sprawdź czy w VS Code na dole masz 'main' czy 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: 57.128.218.55
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH="$PATH:/root/.npm-global/bin:/usr/local/bin:$(npm bin -g 2>/dev/null)"
            cd /root/fabiole-app
            git pull origin main
            npm install
            npx prisma generate
            npm run build
            pm2 restart fabiole-app || PORT=3000 pm2 start npm --name "fabiole-app" -- run start
            pm2 save